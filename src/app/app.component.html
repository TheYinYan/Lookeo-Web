@if (!isRegister) {
  <app-register
    (register)="onRegistered($event)"
    (goToLogin)="onGoToLogin()"
  ></app-register>
} @else if (!isLogged) {
  <app-login
    (login)="onLogin($event)"
    (goRegister)="onGoToRegister()"
  ></app-login>
} @else {
  <app-home [user]="user"></app-home>
}
<app-footer></app-footer>
