@if (!isRegistered) {
  <app-register
    (register)="onRegistered($event)"
    (goToLogin)="onGoToLogin()"
  ></app-register>
} @else if (!isLogged) {
  <app-login
    (login)="onLogin($event)"
    (goRegister)="onGoToRegister()"
  ></app-login>
} @else {
  <app-wardrobe></app-wardrobe>
}
<app-footer></app-footer>
