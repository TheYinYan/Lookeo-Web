@if (!isRegistered) {
  <app-register
    (register)="onRegistered($event)"
    (goToLogin)="onGoToLogin()"
  ></app-register>
} @else if (!isLogged) {
  <app-login
    (login)="onLogin($event)"
    (goRegister)="onGoToRegister()"
  ></app-login>
} @else {
  <nav>
    <a routerLinkActive="activo" routerLink="/home" >Home</a>
    <a routerLinkActive="activo" routerLink="/favoritos">Favoritos</a>
    <a routerLinkActive="activo" routerLink="/wardrobe">wardrobe</a>
    <a routerLinkActive="activo" routerLink="/probador">Probador</a>
    <a routerLinkActive="activo" routerLink="/outfits">Mis Outfits</a>
    <a routerLinkActive="activo" routerLink="/profile">profile</a>

  </nav>
  <hr>
  <router-outlet />
}
<app-footer></app-footer>
